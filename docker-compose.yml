services:
  keyswise:
    build: .
    container_name: keyswise
    ports:
      # porta do host configurável: defina KEYSWISE_PORT (ex.: num .env) se 8084
      # já estiver ocupada no homelab. O container sempre escuta na 80. A porta de
      # cada app é reservada no wisekit (apps.json).
      - "${KEYSWISE_PORT:-8084}:80"
    restart: unless-stopped
